    hrdung und Schutz: Gef\xE4hrdete Arten\n\u2502   \u251C\u2500\u2500  Merkmale\
    \ und Beschreibung der Felsen-Kuckuckshummel\n\u2502   \u2502   \u251C\u2500\u2500\
