id: 2
label: InjectionExperiment
lab_name: injection_lab
class_parts:
- FinetuningExperiment
- InjectionExperiment
module_path: beesup_llm.injection.injection_experiment
do_eval_base_model_rag: true
do_eval_lora_model_rag: true
done: false
do_eval_base_model: true
do_eval_lora_model: true
do_train: true
lora_config:
  r: 32
  lora_alpha: 3
  use_rslora: true
  target_modules: all-linear
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_L
sft_config:
  num_train_epochs: 10
  output_dir: /home/fboehning/fboehning/injection_lab/FinetuningExperiment/InjectionExperiment/0002_InjectionExperiment
  auto_find_batch_size: true
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  optim: paged_adamw_8bit
  save_strategy: 'no'
  eval_strategy: 'no'
  logging_strategy: steps
  logging_steps: 1
  logging_first_step: true
  do_train: true
  do_eval: false
  report_to: none
  max_seq_length: 4096
  packing: false
  seed: 42
data_df:
  class_parts:
  - Datahandle
  - InjectionDatahandle
  module_path: labtools.datahandle
  id: 2
  label: InjectionDatahandle
  lab_name: injection_lab
  use_taxonomy: false
  chunks_dh:
    id: 2
    label: ChunksDatahandle
    lab_name: injection_lab
    class_parts:
    - Datahandle
    - ChunksDatahandle
    module_path: labtools.datahandle
    drop_emb_duplicates: false
    emb_dh:
      id: 2
      label: EmbeddingDatahandle
      lab_name: injection_lab
      class_parts:
      - Datahandle
      - EmbeddingDatahandle
      module_path: labtools.datahandle
      emb_templates:
        s: '{s}'
        p: '{p}'
        o: '{o}'
        spo: '{s}


          {p}


          {o}'
        po: '{p}


          {o}'
        so: '{s}


          {o}'
      base_dh:
        id: 1
        label: wildbienen_database
        lab_name: injection_lab
        class_parts:
        - Datahandle
        - BaseDatahandle
        module_path: labtools.datahandle
      emb_pipe_config:
        id: 1
        label: NVEmbedPipeline
        lab_name: injection_lab
        class_parts:
        - EMBPipeline
        - NVEmbedPipeline
        module_path: beesup_llm.emb
        name_or_path: nvidia/NV-Embed-v2
        instruction: 'Instruct: Given a passage, retrieve a suitable header



          Passage:


          '
llm_pipe:
  class_parts:
  - LLMPipeline
  - LlamaPipeline
  module_path: beesup_llm.llm
  label: LlamaPipeline
  lab_name: injection_lab
  name_or_path: meta-llama/Meta-Llama-3.1-8B-Instruct
  generation_config:
    return_dict_in_generate: false
    max_time: 1200
    do_sample: false
    max_new_tokens: 4096
    pad_token: <|begin_of_text|>
    pad_token_id: 128000
  inference_tokenizer_config:
    padding: longest
    padding_side: left
    max_length: 8192
    pad_token: <|begin_of_text|>
    pad_token_id: 128000
  training_tokenizer_config:
    padding: longest
    padding_side: right
    max_length: 8192
    pad_token: <|end_of_text|>
    pad_token_id: 128001
  pipeline_args:
    return_full_text: false
    clean_up_tokenization_spaces: true
evaluators:
- class_parts:
  - LLMEvaluator
  - InjectionEvaluator
  - MCQEvaluator
  module_path: beesup_llm.injection.injection_evaluation
  id: 1
  label: BEES
  lab_name: injection_lab
